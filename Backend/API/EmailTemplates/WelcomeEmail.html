<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velkommen til Kahoot.Mercantec.tech</title>
</head>
<body style="margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color:#f0f2f5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f0f2f5;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.12);">
          <!-- Header med gradient -->
          <tr>
            <td style="background:linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); padding:32px 40px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:28px; font-weight:700; letter-spacing:-0.5px;">Kahoot.Mercantec.tech</h1>
              <p style="margin:8px 0 0 0; color:rgba(255,255,255,0.9); font-size:14px;">Din quiz-platform</p>
            </td>
          </tr>
          <!-- Indhold -->
          <tr>
            <td style="background-color:#ffffff; padding:40px;">
              <p style="margin:0 0 16px 0; color:#2d3436; font-size:18px; font-weight:600;">Hej {{Username}}! 👋</p>
              <p style="margin:0 0 24px 0; color:#636e72; font-size:16px; line-height:1.6;">Velkommen til platformen. Du er nu tilmeldt og kan logge ind og deltage i quizzer.</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="background-color:#f8f9fa; border-radius:12px; padding:20px; border-left:4px solid #6c5ce7;">
                    <p style="margin:0; color:#2d3436; font-size:15px; line-height:1.5;">Du kan nu <strong>logge ind</strong> med din e-mail og adgangskode på platformen.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color:#dfe6e9; padding:24px 40px; text-align:center;">
              <p style="margin:0; color:#636e72; font-size:14px;">Med venlig hilsen,</p>
              <p style="margin:4px 0 0 0; color:#2d3436; font-weight:600;">{{FromName}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
