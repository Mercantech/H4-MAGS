server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ @no_report;
    }

    location = /results.html {
        try_files /results.html @no_report;
    }

    # Volumet er tomt eller results.html mangler – vis besked i stedet for 404
    location @no_report {
        default_type "text/html; charset=utf-8";
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>E2E rapport</title></head><body><h1>Ingen E2E-rapport endnu</h1><p>Volumet er tomt eller <code>results.html</code> findes ikke.</p><p>Kør først: <code>docker compose --profile cli run bruno-cli</code></p><p>Sørg for at <strong>bruno-cli</strong> og <strong>bruno-reports</strong> bruger samme compose-projekt (så de deler volume <code>bruno-reports</code>).</p><p><a href="/">Genindlæs</a></p></body></html>';
    }
}
